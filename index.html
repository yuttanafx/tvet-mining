<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>
TVET FUTURE MINING
</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

<style>

/* ======================================== */
/* RESET */
/* ======================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{

width:100%;
height:100%;
overflow:hidden;

font-family:
'Segoe UI',
sans-serif;

background:#020611;

color:#fff;
}

/* ======================================== */
/* BACKGROUND */
/* ======================================== */

body::before{

content:'';

position:fixed;
inset:0;

background:

radial-gradient(
circle at top,
rgba(0,183,255,.15),
transparent 40%
),

radial-gradient(
circle at bottom,
rgba(255,170,0,.12),
transparent 40%
),

linear-gradient(
180deg,
#020611 0%,
#071320 100%
);

z-index:-5;
}

/* ======================================== */
/* STARS */
/* ======================================== */

.stars{

position:fixed;
inset:0;
overflow:hidden;
z-index:-3;
}

.stars span{

position:absolute;

width:2px;
height:2px;

background:#ffc400;

border-radius:50%;

animation:float 12s linear infinite;
}

@keyframes float{

0%{
transform:translateY(100vh);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120px);
opacity:0;
}

}

/* ======================================== */
/* APP */
/* ======================================== */

.app{

width:100%;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:8px;
}

.container{

width:100%;
max-width:390px;
height:100%;

border-radius:28px;

padding:14px;

background:
linear-gradient(
180deg,
rgba(3,10,24,.96),
rgba(1,6,15,.98)
);

border:
1px solid rgba(0,255,255,.12);

box-shadow:
0 0 30px rgba(0,0,0,.8),
0 0 80px rgba(0,140,255,.1);

display:flex;
flex-direction:column;
justify-content:space-between;

overflow:hidden;
position:relative;
}

/* ======================================== */
/* TOPBAR */
/* ======================================== */

.topbar{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:4px;
}

.logo-title{

font-size:14px;
font-weight:800;
letter-spacing:3px;
}

.online{

font-size:12px;
font-weight:700;
color:#00ff99;
}

/* ======================================== */
/* CENTER */
/* ======================================== */

.center{

text-align:center;
}

.coin-ring{

width:120px;
height:120px;

margin:auto;

border-radius:50%;

display:flex;
justify-content:center;
align-items:center;

background:
radial-gradient(
circle,
rgba(255,187,0,.25),
transparent 70%
);

box-shadow:
0 0 30px rgba(255,191,0,.6),
0 0 80px rgba(255,191,0,.2);

animation:ring 6s linear infinite;
}

@keyframes ring{

0%{
transform:rotate(0deg);
}

100%{
transform:rotate(360deg);
}

}

.coin-ring img{

width:74px;
height:74px;
object-fit:contain;
}

.balance-title{

margin-top:8px;

font-size:11px;
letter-spacing:2px;

color:#9ca3af;
}

.balance{

font-size:54px;
font-weight:900;

font-family:monospace;

color:#ffcc33;

text-shadow:
0 0 10px rgba(255,204,0,.7),
0 0 30px rgba(255,204,0,.4);
}

.balance span{

font-size:22px;
}

.active-status{

margin-top:4px;

font-size:16px;
font-weight:700;

color:#ff5555;

animation:pulse 1.2s infinite;
}

@keyframes pulse{

0%,100%{
opacity:1;
}

50%{
opacity:.4;
}

}

/* ======================================== */
/* GRID */
/* ======================================== */

.grid{

display:grid;
grid-template-columns:1fr 1fr;
gap:8px;

margin-top:10px;
}

.card{

height:68px;

padding:10px;

border-radius:16px;

background:
linear-gradient(
180deg,
rgba(0,18,40,.95),
rgba(0,10,20,.95)
);

border:
1px solid rgba(0,255,255,.14);

display:flex;
flex-direction:column;
justify-content:center;
}

.card-title{

font-size:10px;
color:#999;
margin-bottom:5px;
}

.card-value{

font-size:15px;
font-weight:800;
color:#ffc400;
}

/* ======================================== */
/* GRAPH */
/* ======================================== */

.graph-box{

height:120px;

margin-top:10px;

border-radius:18px;

overflow:hidden;

position:relative;

background:
linear-gradient(
180deg,
rgba(0,0,0,.45),
rgba(0,10,20,.9)
);

border:
1px solid rgba(255,191,0,.15);
}

svg{

position:absolute;
width:100%;
height:100%;
}

.graph-line{

fill:none;

stroke:#ffcc33;
stroke-width:4;

stroke-linecap:round;
stroke-linejoin:round;

filter:drop-shadow(
0 0 10px #ffcc33
);

stroke-dasharray:1000;
stroke-dashoffset:1000;

animation:draw 4s linear infinite;
}

@keyframes draw{

to{
stroke-dashoffset:0;
}

}

/* ======================================== */
/* BUTTONS */
/* ======================================== */

.bottom-buttons{

display:grid;
grid-template-columns:1fr 1fr;
gap:8px;

margin-top:10px;
}

.action-btn{

height:46px;

border:none;
border-radius:14px;

font-size:12px;
font-weight:800;

color:#fff;

cursor:pointer;

transition:.2s;
}

.action-btn:active{

transform:scale(.96);
}

.stop-btn{

background:
linear-gradient(
135deg,
#ff4d4d,
#5f1010
);
}

.claim-btn{

background:
linear-gradient(
135deg,
#00ff99,
#065f46
);
}

.web3-btn{

background:
linear-gradient(
135deg,
#8b5cf6,
#4c1d95
);
}

.add-btn{

background:
linear-gradient(
135deg,
#00c3ff,
#0047ab
);
}

/* ======================================== */
/* WALLET */
/* ======================================== */

.wallet-box{

margin-top:10px;

padding:10px;

border-radius:14px;

background:
rgba(255,255,255,.03);

border:
1px solid rgba(255,255,255,.08);

font-size:12px;

text-align:center;
}

/* ======================================== */
/* LOGIN */
/* ======================================== */

.login{

position:fixed;
inset:0;

background:#020611;

display:flex;
justify-content:center;
align-items:center;

z-index:999;
}

.login-box{

width:90%;
max-width:330px;

padding:25px;

border-radius:24px;

background:
linear-gradient(
180deg,
rgba(0,10,20,.96),
rgba(0,0,0,.96)
);

border:
1px solid rgba(255,191,0,.2);

text-align:center;
}

.login-box h2{

margin-bottom:20px;
color:#ffcc33;
}

.input{

width:100%;
height:48px;

margin-bottom:10px;

border:none;
outline:none;

padding:0 14px;

border-radius:12px;

background:#07111d;

color:#fff;
}

.login-btn{

width:100%;
height:50px;

border:none;
border-radius:14px;

font-size:14px;
font-weight:800;

background:
linear-gradient(
135deg,
#ffcc33,
#ff9900
);
}

/* ======================================== */
/* MOBILE */
/* ======================================== */

@media(max-height:760px){

.balance{
font-size:46px;
}

.graph-box{
height:95px;
}

.card{
height:62px;
}

.action-btn{
height:42px;
}

}

</style>
</head>

<body>

<!-- STARS -->

<div class="stars">

<span style="left:10%;animation-delay:0s"></span>
<span style="left:20%;animation-delay:1s"></span>
<span style="left:30%;animation-delay:2s"></span>
<span style="left:40%;animation-delay:3s"></span>
<span style="left:50%;animation-delay:4s"></span>
<span style="left:60%;animation-delay:5s"></span>
<span style="left:70%;animation-delay:6s"></span>
<span style="left:80%;animation-delay:7s"></span>
<span style="left:90%;animation-delay:8s"></span>

</div>

<!-- LOGIN -->

<div
id="loginSection"
class="login">

<div class="login-box">

<h2>
TVET ENERGY MINING
</h2>

<input
type="text"
id="userInput"
class="input"
placeholder="Username">

<input
type="password"
id="passInput"
class="input"
placeholder="Password">

<button
class="login-btn"
onclick="loginAction()">

ENTER SYSTEM

</button>

</div>
</div>

<!-- APP -->

<div class="app">

<div class="container">

<!-- TOP -->

<div class="topbar">

<div class="logo-title">

TVET NODE-07

</div>

<div class="online">

ONLINE ●

</div>

</div>

<!-- CENTER -->

<div class="center">

<div class="coin-ring">

<img
src="https://i.postimg.cc/ncjSwbjv/Gemini-Generated-Image-ncdze7ncdze7ncdz-removebg-preview.png">

</div>

<div class="balance-title">

LIVE TVE BALANCE

</div>

<div
class="balance"
id="balanceDisplay">

0.0000
<span>TVE</span>

</div>

<div class="active-status">

● MINING PAUSED

</div>

</div>

<!-- GRID -->

<div class="grid">

<div class="card">

<div class="card-title">
EFFICIENCY
</div>

<div class="card-value">
97.5%
</div>

</div>

<div class="card">

<div class="card-title">
HASH RATE
</div>

<div class="card-value">
132 TH/s
</div>

</div>

<div class="card">

<div class="card-title">
MINING SPEED
</div>

<div
class="card-value"
id="rateDisplay">

0.0000 TVE/s

</div>

</div>

<div class="card">

<div class="card-title">
DIFFICULTY
</div>

<div class="card-value">
PHASE 1
</div>

</div>

</div>

<!-- GRAPH -->

<div class="graph-box">

<svg viewBox="0 0 400 120">

<path
class="graph-line"

d="
M10 100
L50 90
L90 95
L130 70
L170 55
L210 45
L250 48
L290 30
L330 12
L390 20
"/>

</svg>

</div>

<!-- BUTTONS -->

<div class="bottom-buttons">

<button
class="action-btn claim-btn"
id="mineBtn"
onclick="toggleMining()">

START MINING

</button>

<button
class="action-btn stop-btn"
onclick="claimReward()">

CLAIM TVE

</button>

<button
class="action-btn web3-btn"
onclick="connWallet()">

CONNECT WEB3

</button>

<button
class="action-btn add-btn"
onclick="addTokenManual()">

+ ADD TVE

</button>

<button
class="action-btn stop-btn"
onclick="resetSystem()">

RESET SYSTEM

</button>

</div>

<!-- WALLET -->

<div
class="wallet-box"
id="walletAddress">

Wallet Not Connected

</div>

</div>

</div>

<script>

/* ======================================== */
/* DATABASE */
/* ======================================== */

let user = null;

let mining = false;

let balance = 0;

let miningRate = 0;

let miningInterval = null;

const DB = {

"tvetech":{

pass:"tve2026",
rate:0.0100

},

"tve001":{

pass:"power999",
rate:0.0020

},

"varunya":{

pass:"tve789",
rate:0.0050

}

};

/* ======================================== */
/* LOGIN */
/* ======================================== */

function loginAction(){

const u =
document.getElementById(
"userInput"
).value.trim().toLowerCase();

const p =
document.getElementById(
"passInput"
).value.trim();

if(DB[u] &&
DB[u].pass === p){

user = u;

miningRate =
DB[u].rate;

document.getElementById(
"loginSection"
).style.display = "none";

document.getElementById(
"rateDisplay"
).innerText =

miningRate.toFixed(4)
+
" TVE/s";

loadBalance();

}else{

alert(
"INVALID LOGIN"
);

}

}

/* ======================================== */
/* LOAD BALANCE */
/* ======================================== */

function loadBalance(){

balance =
parseFloat(

localStorage.getItem(
"tvet_balance_" + user
)

|| 0

);

updateBalance();

}

/* ======================================== */
/* UPDATE BALANCE */
/* ======================================== */

function updateBalance(){

document.getElementById(
"balanceDisplay"
).innerHTML =

balance.toFixed(4)

+

' <span>TVE</span>';

}

/* ======================================== */
/* MINING */
/* ======================================== */

function toggleMining(){

const btn =
document.getElementById(
"mineBtn"
);

const active =
document.querySelector(
".active-status"
);

mining = !mining;

if(mining){

btn.innerText =
"STOP MINING";

btn.className =
"action-btn stop-btn";

active.innerHTML =
"● CARBON CREDIT ACTIVE";

active.style.color =
"#00ff99";

miningInterval =
setInterval(()=>{

balance = Number(
(
balance + miningRate
).toFixed(4)
);

updateBalance();

localStorage.setItem(

"tvet_balance_" + user,

balance

);

},1000);

}else{

btn.innerText =
"START MINING";

btn.className =
"action-btn claim-btn";

active.innerHTML =
"● MINING PAUSED";

active.style.color =
"#ff5555";

clearInterval(
miningInterval
);

}

}

/* ======================================== */
/* CONNECT WALLET */
/* ======================================== */

async function connWallet(){

if(!window.ethereum){

alert(
"MetaMask Not Found"
);

return;
}

const provider =
new ethers.BrowserProvider(
window.ethereum
);

const signer =
await provider.getSigner();

const address =
await signer.getAddress();

document.getElementById(
"walletAddress"
).innerHTML =

address.substring(0,6)
+
"..."
+
address.substring(38);

}

/* ======================================== */
/* CLAIM */
/* ======================================== */

async function claimReward() {

    if(balance <= 0){

        alert("ไม่มีเหรียญให้เคลม");
        return;
    }

    try{

        if(!window.ethereum){

            alert("ไม่พบ MetaMask");
            return;
        }

        const provider =
        new ethers.BrowserProvider(
            window.ethereum
        );

        const signer =
        await provider.getSigner();

        const network =
        await provider.getNetwork();

        if(Number(network.chainId) !== 137){

            alert(
            "กรุณาเปลี่ยนเป็น Polygon Mainnet"
            );

            return;
        }

        const userAddress =
        await signer.getAddress();

        const safeAmount =
        Number(balance.toFixed(4));

        const amountToClaim =
        ethers.parseUnits(
            safeAmount.toString(),
            18
        );

        const response =
        await fetch(

        "https://tvet-mining.vercel.app/api/get-signature",

        {

            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

                userAddress,

                amount:
                amountToClaim.toString()
            })
        });

        const data =
        await response.json();

        if(!data.signature){

            throw new Error(
            "Signature Error"
            );
        }

        const contract =
        new ethers.Contract(

        "0x170C62cAF21EE43A8527e0D858eB1ca76b79b342",

        [
        "function claimTokens(uint256 amount, bytes signature) external"
        ],

        signer
        );

        alert(
        "กรุณากด Confirm"
        );

        const tx =
        await contract.claimTokens(

            amountToClaim,

            data.signature
        );

        await tx.wait();

        alert(
        "โอนเหรียญสำเร็จ"
        );

        balance = 0;

        updateBalance();

        localStorage.setItem(
            "tvet_balance_" + user,
            0
        );

    }catch(err){

        console.log(err);

        alert(
        "Claim Error:\n\n" +
        (
            err.reason ||
            err.message
        )
        );
    }
}

/* ======================================== */
/* ADD TOKEN */
/* ======================================== */

async function addTokenManual(){

if(!window.ethereum){

alert(
"MetaMask Not Found"
);

return;
}

try{

await window.ethereum.request({

method:'wallet_watchAsset',

params:{

type:'ERC20',

options:{

address:
'0xa5CF2B6A6E333924ECFaA5C9566578DA7cD571f7',

symbol:'TVE',

decimals:18

}

}

});

}catch(err){

console.log(err);

}

}

/* ======================================== */
/* RESET */
/* ======================================== */

function resetSystem(){

const confirmReset = confirm(

"รีเซตค่าทั้งหมด ?"

);

if(!confirmReset){
return;
}

if(miningInterval){

clearInterval(
miningInterval
);

}

mining = false;

balance = 0;

updateBalance();

localStorage.clear();

document.getElementById(
"mineBtn"
).innerText =
"START MINING";

document.getElementById(
"mineBtn"
).className =
"action-btn claim-btn";

document.querySelector(
".active-status"
).innerHTML =
"● MINING PAUSED";

document.querySelector(
".active-status"
).style.color =
"#ff5555";

document.getElementById(
"walletAddress"
).innerHTML =
"Wallet Not Connected";

alert(
"รีเซตสำเร็จ"
);

location.reload();

}

</script>

</body>
</html>
