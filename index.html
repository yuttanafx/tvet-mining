<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TVET Deep Tech Mining</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background: #090d16; color: #fff; font-family: sans-serif; overflow: hidden; }
        .app-container { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 25px; padding: 15px; width: 95%; max-width: 340px; height: 95vh; margin: 5px auto; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; }
        .logo-img { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto; }
        .balance-value { font-size: 30px; font-weight: 800; font-family: monospace; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
        .stat-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(245, 158, 11, 0.2); padding: 8px; border-radius: 12px; }
        .stat-value { font-size: 13px; font-weight: bold; color: #fbbf24; }
        .stat-label { font-size: 8px; color: #9ca3af; text-transform: uppercase; }
        .btn { width: 100%; padding: 10px; font-size: 13px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; margin-bottom: 5px; }
        .btn-primary { background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%); color: #000; }
        .btn-stop { background: #ef4444; color: #fff; }
        .btn-claim { background: linear-gradient(90deg, #10b981 0%, #059669 100%); color: #fff; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #090d16; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .input-field { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; margin-bottom: 10px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="loginSection" class="login-overlay">
        <div style="width:100%; max-width:300px;">
            <input type="text" id="userInput" class="input-field" placeholder="Username">
            <input type="password" id="passInput" class="input-field" placeholder="Password">
            <button class="btn btn-primary" onclick="loginAction()">Login</button>
        </div>
    </div>

    <div class="app-container">
        <div>
            <img src="https://i.postimg.cc/ncjSwbjv/Gemini-Generated-Image-ncdze7ncdze7ncdz-removebg-preview.png" class="logo-img">
            <div id="currentLoggedUser" style="font-size:10px; color:#fbbf24;">ไม่ได้ล็อกอิน</div>
            <div class="balance-value" id="balanceDisplay">0.0000</div>
        </div>

        <div class="dashboard-grid">
            <div class="stat-card"><div class="stat-label">Efficiency</div><div class="stat-value">98.5%</div></div>
            <div class="stat-card"><div class="stat-label">Carbon Offset</div><div class="stat-value">0.34 tCO2</div></div>
        </div>
        <canvas id="miningChart" style="max-height: 80px; width: 100%; margin-bottom: 10px;"></canvas>

        <div>
            <button class="btn btn-primary" id="mineBtn" onclick="toggleMining()">Start Mining</button>
            <button class="btn btn-claim" onclick="claimReward()">Claim Credit</button>
            <button class="btn" style="background:#333; color:#fff;" onclick="addTokenManual()">+ Add TVE</button>
        </div>
    </div>

    <script>
        let user = null, bR = 0, bal = 0, intV = null;
        var DB = { "tvetech": { pass: "tve2026", rate: 0.0100 }, "tve001": { pass: "power999", rate: 0.0020 } };
        
        function loginAction() {
            let u = document.getElementById("userInput").value.trim().toLowerCase(), p = document.getElementById("passInput").value.trim();
            if(DB[u] && DB[u].pass === p) { user = u; bR = DB[u].rate; document.getElementById("loginSection").style.display = "none"; document.getElementById("currentLoggedUser").innerText = "User: " + u; loadBal(); }
            else { alert("Login failed"); }
        }
        function loadBal(){ bal = parseFloat(localStorage.getItem("bal_"+user) || 0); document.getElementById("balanceDisplay").innerText = bal.toFixed(4); }
        function toggleMining() {
            const btn = document.getElementById("mineBtn");
            if(intV) { clearInterval(intV); intV = null; btn.innerText = "Start Mining"; btn.className = "btn btn-primary"; }
            else { intV = setInterval(()=>{ bal += bR; document.getElementById("balanceDisplay").innerText = bal.toFixed(4); localStorage.setItem("bal_"+user, bal); }, 1000); btn.innerText = "Stop"; btn.className = "btn btn-stop"; }
        }
        async function claimReward() {
            if (bal <= 0) { alert("ไม่มีเหรียญ"); return; }
            const provider = new ethers.BrowserProvider(window.ethereum); const signer = await provider.getSigner(); const userAddress = await signer.getAddress();
            try {
                const amount = ethers.parseUnits(bal.toFixed(18), 18);
                const res = await fetch("https://tvet-mining.vercel.app/api/get-signature", { method: "POST", headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userAddress, amount: amount.toString() }) });
                const data = await res.json();
                const contract = new ethers.Contract("0xd77887dB74B319276B27446AB43A161B250EC6B5", ["function claimTokens(uint256, bytes)"], signer);
                await (await contract.claimTokens(amount, data.signature)).wait();
                alert("โอนสำเร็จ!"); bal = 0; localStorage.setItem("bal_"+user, 0); document.getElementById("balanceDisplay").innerText = "0.0000";
            } catch(e) { console.error(e); alert("โอนล้มเหลว"); }
        }
        async function addTokenManual() { await window.ethereum.request({ method: 'wallet_watchAsset', params: { type: 'ERC20', options: { address: '0xa5CF2B6A6E333924ECFaA5C9566578DA7cD571f7', symbol: 'TVE', decimals: 18 } } }); }
        
        const ctx = document.getElementById('miningChart').getContext('2d');
        new Chart(ctx, { type: 'line', data: { labels: [1,2,3,4,5], datasets: [{ data: [0.01, 0.012, 0.011, 0.015, 0.014], borderColor: '#fbbf24', tension: 0.4, fill: true, backgroundColor: 'rgba(251, 191, 36, 0.05)' }] }, options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { display: false } } } });
    </script>
</body>
</html>
