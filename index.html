<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TVET FUTURE MINING</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* (สไตล์เดิมของคุณทั้งหมด + เพิ่มเติมส่วน Dashboard) */
        *{margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
        html,body{width:100%; height:100%; overflow:hidden; font-family:'Segoe UI', sans-serif; background:#020611; color:#fff;}
        body::before{content:''; position:fixed; inset:0; background:radial-gradient(circle at top, rgba(0,183,255,.18), transparent 40%), radial-gradient(circle at bottom, rgba(255,170,0,.10), transparent 40%), linear-gradient(180deg, #020611 0%, #071320 100%); z-index:-5;}
        .app{width:100%; height:100vh; display:flex; justify-content:center; align-items:center; padding:6px;}
        .container{width:100%; max-width:390px; height:100%; border-radius:30px; padding:14px; background:linear-gradient(180deg, rgba(3,10,24,.96), rgba(1,6,15,.98)); border:1px solid rgba(0,255,255,.12); display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow-y:auto;}
        
        /* สไตล์ Dashboard ใหม่ */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 10px 0; }
        .stat-card { background: rgba(0,18,40,.95); border: 1px solid rgba(0,255,255,.12); border-radius: 16px; padding: 10px; text-align: center; }
        .stat-label { font-size: 8px; color: #999; text-transform: uppercase; }
        .stat-value { font-size: 14px; font-weight: 800; color: #ffc400; margin-top: 4px; }

        /* สไตล์เดิม */
        .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;}
        .logo-img{width:70px; height:70px; border-radius:50%; margin:0 auto; display:block;}
        .balance{font-size:40px; font-weight:900; font-family:monospace; color:#ffcc33; text-align:center;}
        .action-btn{width:100%; height:46px; border:none; border-radius:14px; font-size:12px; font-weight:800; color:#fff; cursor:pointer; margin-bottom:6px;}
        .stop-btn{background:linear-gradient(135deg, #ff4d4d, #5f1010);}
        .claim-btn{background:linear-gradient(135deg, #00ff99, #065f46);}
        .web3-btn{background:linear-gradient(135deg, #8b5cf6, #4c1d95);}
        .add-btn{background:linear-gradient(135deg, #00c3ff, #0047ab);}
        .login-overlay { position: fixed; inset:0; background:#020611; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { width:90%; max-width:320px; padding:25px; border-radius:24px; background:#07111d; border:1px solid #f59e0b; text-align:center; }
        .input-field { width: 100%; padding: 12px; border-radius: 10px; background: #000; color: #fff; margin-bottom: 10px; border: 1px solid #333; }
        .btn-login { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #f59e0b; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="loginSection" class="login-overlay">
        <div class="login-box">
            <h2>TVET ENERGY MINING</h2>
            <input type="text" id="userInput" class="input-field" placeholder="Username">
            <input type="password" id="passInput" class="input-field" placeholder="Password">
            <button class="btn-login" onclick="loginAction()">ENTER SYSTEM</button>
        </div>
    </div>

    <div class="app">
        <div class="container">
            <div class="topbar"><div class="logo-title">TVET NODE-07</div><div class="online">ONLINE ●</div></div>
            
            <div class="center">
                <img src="https://i.postimg.cc/ncjSwbjv/Gemini-Generated-Image-ncdze7ncdze7ncdz-removebg-preview.png" class="logo-img">
                <div class="balance" id="balanceDisplay">0.0000 <span>TVE</span></div>
            </div>

            <div class="dashboard-grid">
                <div class="stat-card"><div class="stat-label">EFFICIENCY</div><div class="stat-value">98.5%</div></div>
                <div class="stat-card"><div class="stat-label">CARBON OFFSET</div><div class="stat-value">0.34 tCO2</div></div>
            </div>
            <canvas id="miningChart" style="height: 80px; width: 100%;"></canvas>

            <div class="bottom-buttons">
                <button class="action-btn claim-btn" id="mineBtn" onclick="toggleMining()">START MINING</button>
                <button class="action-btn stop-btn" onclick="claimReward()">CLAIM TVE</button>
                <button class="action-btn web3-btn" onclick="connWallet()">CONNECT WEB3</button>
                <button class="action-btn add-btn" onclick="addTokenManual()">+ ADD TVE</button>
            </div>
        </div>
    </div>

    <script>
        let balance = 0, miningRate = 0.002, mining = false, miningInterval = null, user = null;
        
        function toggleMining(){
            mining = !mining;
            const btn = document.getElementById("mineBtn");
            if(mining){
                btn.innerText = "STOP MINING";
                miningInterval = setInterval(()=>{
                    balance = Number((balance + miningRate).toFixed(4));
                    document.getElementById("balanceDisplay").innerHTML = balance.toFixed(4) + ' <span>TVE</span>';
                }, 1000);
            } else {
                btn.innerText = "START MINING";
                clearInterval(miningInterval);
            }
        }

        async function claimReward() {
            if (balance < 1) { alert("สะสมให้ครบ 1 TVE ก่อน"); return; }
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const signer = await provider.getSigner();
                const userAddress = await signer.getAddress();
                
                // แก้บั๊ก Panic 17: ส่งเฉพาะค่าจำนวนเต็ม
                const safeAmount = Math.floor(balance).toString();
                const amountToClaim = ethers.parseUnits(safeAmount, 18);

                const response = await fetch("https://tvet-mining.vercel.app/api/get-signature", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userAddress, amount: amountToClaim.toString() })
                });
                const data = await response.json();
                
                const contract = new ethers.Contract("0xd77887dB74B319276B27446AB43A161B250EC6B5", ["function claimTokens(uint256, bytes) external"], signer);
                const tx = await contract.claimTokens(amountToClaim, data.signature);
                await tx.wait();
                alert("โอนสำเร็จ!");
                balance = 0;
            } catch(err) {
                alert("Error: " + (err.reason || err.message));
            }
        }

        function loginAction(){ document.getElementById("loginSection").style.display = "none"; }
        function connWallet(){ alert("Connecting..."); }
        function addTokenManual(){ alert("Adding..."); }

        // กราฟ
        const ctx = document.getElementById('miningChart').getContext('2d');
        new Chart(ctx, { type: 'line', data: { labels: [1,2,3,4,5], datasets: [{ data: [0.1, 0.4, 0.2, 0.6, 0.3, 0.5], borderColor: '#ffcc33', tension: 0.4, fill: true, backgroundColor: 'rgba(255,204,51,0.1)' }] }, options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { display: false } } } });
    </script>
</body>
</html>
