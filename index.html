<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TVET Telegram Web3 Mining V2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #060913; }
        body { font-family: 'Segoe UI', sans-serif; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; }
        .app-container { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 20px; padding: 15px; width: 340px; height: 590px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; }
        .network-badge { background: linear-gradient(90deg, #8247e5 0%, #6f34d2 100%); color: #ffffff; font-size: 10px; font-weight: bold; padding: 3px 10px; border-radius: 20px; margin: 0 auto 8px auto; width: fit-content; }
        .logo-img { width: 75px; height: 75px; border-radius: 50%; margin: 0 auto 5px auto; }
        .balance-value { font-size: 30px; font-weight: 800; margin: 5px 0; font-family: monospace; }
        .btn { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-tg { background: #24a1de; }
        .btn-primary { background: #f59e0b; }
        .btn-claim { background: #10b981; }
        .info-box { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 10px; font-size: 11px; text-align: left; margin: 5px 0; }
    </style>
</head>
<body>
    <div class="app-container">
        <div>
            <div class="network-badge">🌐 Polygon Mainnet</div>
            <img src="https://i.postimg.cc/ncjSwbjv/Gemini-Generated-Image-ncdze7ncdze7ncdz-removebg-preview.png" class="logo-img">
            <div id="status" style="font-size:11px; color:#fbbf24;">เชื่อมต่อกระเป๋าเพื่อเริ่มต้น</div>
            <div class="balance-value" id="balanceDisplay">0.0000</div>
        </div>
        <div>
            <div class="info-box" onclick="checkGasBalance()" style="cursor:pointer;">
                <div>⛽ แก๊ส POL: <span id="gasValueDisplay">คลิกเพื่อเช็กยอด...</span></div>
                <div>📊 ผลิตแล้ว: <span id="totalSupplyDisplay">...</span></div>
                <div>⚡ ความเร็ว: <span id="rateDisplay">0.0050 TVE/บล็อก</span></div>
            </div>
            <button class="btn btn-tg" id="loginBtn" onclick="quickLogin()">⚡ เชื่อมต่อกระเป๋าด่วน</button>
            <button class="btn btn-primary" id="mineBtn" disabled onclick="handleMiningAction()">🚀 เริ่มขุดจริง (Start)</button>
            <button class="btn btn-claim" id="claimBtn" onclick="claimMiningReward()">ถอนเหรียญเข้ากระเป๋า</button>
        </div>
        <div id="walletAddress" class="info-box" style="font-size:10px; word-break:break-all;">สถานะ: ไม่ได้เชื่อมต่อ</div>
    </div>

    <script>
        // 🎯 วางเลขสัญญาที่นี่ให้ครบครับพี่
        const MINING_CONTRACT = "0x6Caa0219a0ACb4d6E4eC76764691a3D4c2148648"; 
        const TOKEN_CONTRACT = "0x003129a07b947ABf696C91FdB440EC77f26613B7";
        const ABI = ["function startMining() external", "function stopMining() external", "function claimReward() external", "function getRewardRate() external view returns (uint256)"];
        
        let provider, signer, contract, walletAddr;

        async function quickLogin() {
            try {
                const rpcs = ["https://polygon-llamarpc.com", "https://polygon-rpc.com"];
                provider = new ethers.JsonRpcProvider(rpcs[0]);
                let pk = localStorage.getItem('tvet_pkey') || ethers.Wallet.createRandom().privateKey;
                localStorage.setItem('tvet_pkey', pk);
                signer = new ethers.Wallet(pk, provider);
                walletAddr = await signer.getAddress();
                contract = new ethers.Contract(MINING_CONTRACT, ABI, signer);
                
                document.getElementById('walletAddress').innerText = walletAddr;
                document.getElementById('mineBtn').disabled = false;
                document.getElementById('status').innerText = "🟢 เชื่อมต่อสำเร็จ";
                checkGasBalance();
            } catch(e) { alert("เชื่อมต่อไม่ได้"); }
        }

        async function checkGasBalance() {
            const balanceRaw = await provider.getBalance(walletAddr);
            document.getElementById('gasValueDisplay').innerText = ethers.formatUnits(balanceRaw, 18) + " POL";
        }

        async function handleMiningAction() {
            try {
                const tx = await contract.startMining({ gasLimit: 300000 });
                document.getElementById('status').innerText = "⛏️ ขุดจริงแล้ว!";
            } catch(e) { alert("ขุดไม่ได้! เช็กแก๊ส POL ในกระเป๋าครับ"); }
        }

        async function claimMiningReward() {
            try {
                const tx = await contract.claimReward({ gasLimit: 300000 });
                await tx.wait();
                alert("ถอนสำเร็จ!");
            } catch(e) { alert("ถอนไม่ได้!"); }
        }
    </script>
</body>
</html>
