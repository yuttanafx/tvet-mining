<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVET Token Mining App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #090d16 0%, #111827 100%); color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .app-container { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(245, 158, 11, 0.2); border-radius: 25px; padding: 30px 20px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .logo-img { width: 140px; height: 140px; border-radius: 50%; border: 3px solid #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); margin-bottom: 15px; object-fit: cover; }
        .mining-status { font-size: 13px; color: #34d399; background: rgba(52, 211, 153, 0.15); padding: 6px 14px; border-radius: 20px; display: inline-block; margin-bottom: 15px; font-weight: 500; }
        .balance-title { font-size: 13px; color: #9ca3af; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .balance-value { font-size: 38px; font-weight: 800; color: #ffffff; margin: 5px 0 20px 0; }
        .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; transition: all 0.2s; margin-bottom: 12px; }
        .btn-primary { background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%); color: #000000; }
        .btn-web3 { background: rgba(130, 71, 229, 0.15); color: #a78bfa; border: 1px solid rgba(130, 71, 229, 0.4); }
        .info-text { font-size: 11px; color: #6b7280; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="app-container">
        <img src="https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=300&h=300&fit=crop" class="logo-img" alt="TVET Logo">
        <div class="mining-status" id="miningStatus">ระบบพร้อมเปิดใช้งาน</div>
        <p class="balance-title">ยอด TVET สะสม</p>
        <div class="balance-value" id="balanceDisplay">0.0000</div>
        <button class="btn btn-primary" id="mineBtn" onclick="toggleMining()">เริ่มขุด (Start Mining)</button>
        <button class="btn btn-web3" id="walletBtn" onclick="connectWallet()">เชื่อมต่อกระเป๋า Web3</button>
        <div class="info-text" id="walletAddress">สถานะกระเป๋า: ยังไม่ได้ผูกระบบ</div>
    </div>
    <script>
        let isMining = false; let balance = 0.0000; let miningInterval;
        function toggleMining() {
            const mineBtn = document.getElementById('mineBtn'); const statusDisp = document.getElementById('miningStatus');
            if (!isMining) {
                isMining = true; mineBtn.innerText = "กำลังขุดระบบ... กดหยุด"; mineBtn.style.background = "#ef4444"; mineBtn.style.color = "#ffffff"; statusDisp.innerText = "⛏️ กำลังจำลองระบบขุด TVET..."; statusDisp.style.color = "#fbbf24";
                miningInterval = setInterval(() => { balance += 0.002778; document.getElementById('balanceDisplay').innerText = balance.toFixed(4); }, 1000);
            } else {
                isMining = false; clearInterval(miningInterval); mineBtn.innerText = "ขุดต่อ (Resume Mining)"; mineBtn.style.background = "linear-gradient(90deg, #f59e0b 0%, #d97706 100%)"; mineBtn.style.color = "#000000"; statusDisp.innerText = "หยุดการขุดชั่วคราว"; statusDisp.style.color = "#9ca3af";
            }
        }
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    document.getElementById('walletAddress').innerText = `กระเป๋า: ${accounts[0].substring(0,6)}...${accounts[0].substring(accounts[0].length-4)}`;
                    document.getElementById('walletBtn').innerText = "เชื่อมต่อสำเร็จ"; document.getElementById('walletBtn').style.background = "#10b981"; document.getElementById('walletBtn').style.color = "#ffffff";
                } catch (error) { alert("ปฏิเสธการเชื่อมต่อ"); }
            } else { alert("กรุณาเปิดลิงก์เว็บนี้ในแอป MetaMask บนมือถือครับ"); }
        }
    </script>
</body>
</html>
