// PARTICLES
const canvas = document.getElementById('particles');
const pctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = [];

for(let i=0;i<80;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2,
        d:Math.random()*1
    });
}

function drawParticles(){

    pctx.clearRect(0,0,canvas.width,canvas.height);

    pctx.fillStyle = 'rgba(251,191,36,0.4)';

    particles.forEach(p=>{
        pctx.beginPath();
        pctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        pctx.fill();

        p.y += p.d;

        if(p.y > canvas.height){
            p.y = 0;
        }
    });

    requestAnimationFrame(drawParticles);
}

drawParticles();


// ADVANCED HUD EFFECTS
const networkCanvas = document.createElement('canvas');
networkCanvas.id = 'networkCanvas';
networkCanvas.style.position = 'fixed';
networkCanvas.style.inset = '0';
networkCanvas.style.zIndex = '1';
networkCanvas.style.pointerEvents = 'none';
document.body.appendChild(networkCanvas);

const nctx = networkCanvas.getContext('2d');
networkCanvas.width = window.innerWidth;
networkCanvas.height = window.innerHeight;

const nodes = [];

for(let i=0;i<35;i++){
    nodes.push({
        x:Math.random()*networkCanvas.width,
        y:Math.random()*networkCanvas.height,
        vx:(Math.random()-0.5)*0.5,
        vy:(Math.random()-0.5)*0.5
    });
}

function drawNetwork(){

    nctx.clearRect(0,0,networkCanvas.width,networkCanvas.height);

    for(let i=0;i<nodes.length;i++){

        const a = nodes[i];

        a.x += a.vx;
        a.y += a.vy;

        if(a.x < 0 || a.x > networkCanvas.width) a.vx *= -1;
        if(a.y < 0 || a.y > networkCanvas.height) a.vy *= -1;

        nctx.beginPath();
        nctx.arc(a.x,a.y,2,0,Math.PI*2);
        nctx.fillStyle = 'rgba(251,191,36,0.6)';
        nctx.fill();

        for(let j=i+1;j<nodes.length;j++){

            const b = nodes[j];

            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if(dist < 120){
                nctx.beginPath();
                nctx.moveTo(a.x,a.y);
                nctx.lineTo(b.x,b.y);
                nctx.strokeStyle = 'rgba(251,191,36,' + (1 - dist/120) * 0.2 + ')';
                nctx.stroke();
            }
        }
    }

    requestAnimationFrame(drawNetwork);
}

drawNetwork();
