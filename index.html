<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TVET Telegram Private Mining</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #090d16; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #090d16 0%, #111827 100%); color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; }
        .app-container { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 25px; padding: 15px 20px; width: 100%; max-width: 340px; height: 95vh; max-height: 580px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; }
        .logo-img { width: 85px; height: 85px; border-radius: 50%; box-shadow: 0 0 25px rgba(27, 169, 233, 0.6); margin: 0 auto 5px auto; display: block; object-fit: contain; }
        .mining-status { font-size: 11px; color: #fbbf24; background: rgba(245, 158, 11, 0.15); padding: 5px 10px; border-radius: 20px; display: inline-block; margin-bottom: 5px; font-weight: 500; width: 100%; box-sizing: border-box; }
        .balance-value { font-size: 34px; font-weight: 800; color: #ffffff; margin: 5px 0; font-family: monospace; }
        .btn { width: 100%; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; margin-bottom: 6px; }
        .btn-primary { background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%); color: #000000; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #090d16; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: rgba(17, 24, 39, 0.95); border: 1px solid #f59e0b; border-radius: 20px; padding: 20px; width: 85%; max-width: 300px; text-align: center; }
        .input-field { width: 100%; padding: 10px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="loginSection" class="login-overlay">
        <div class="login-box">
            <h3>TVET LOGIN</h3>
            <input type="text" id="userInput" class="input-field" placeholder="Username">
            <input type="password" id="passInput" class="input-field" placeholder="Password">
            <button class="btn btn-primary" onclick="handleLogin()">เข้าสู่ระบบ</button>
        </div>
    </div>

    <div class="app-container">
        <div>
            <img src="https://i.postimg.cc/ncjSwbjv/Gemini-Generated-Image-ncdze7ncdze7ncdz-removebg-preview.png" class="logo-img">
            <div id="currentLoggedUser" style="color:#fbbf24; margin-top:10px;">User: -</div>
            <div class="balance-value" id="balanceDisplay">0.0000</div>
        </div>
        <div>
            <button class="btn btn-primary" id="mineBtn" onclick="handleMiningAction()">เริ่มขุด (Start)</button>
            <button class="btn" onclick="logout()" style="background:#374151; color:#fff;">ออกจากระบบ</button>
        </div>
    </div>

    <script>
        // 🎯 พี่เพิ่มรายชื่อสมาชิกตรงนี้ได้เลยครับ!
        const MEMBER_DATABASE = {
            "terravolteco": { "pass": "tve2026", "rate": 0.0100 },
            "tve001":       { "pass": "power999", "rate": 0.0020 },
            "customer01":   { "pass": "pass1234", "rate": 0.0020 }
        };

        let baseRate = 0, loggedInUser = "", uiInterval = null;

        function handleLogin() {
            const user = document.getElementById('userInput').value.trim().toLowerCase();
            const pass = document.getElementById('passInput').value.trim();
            if (MEMBER_DATABASE[user] && MEMBER_DATABASE[user].pass === pass) {
                loggedInUser = user;
                baseRate = MEMBER_DATABASE[user].rate;
                document.getElementById('loginSection').style.display = "none";
                document.getElementById('currentLoggedUser').innerText = "User: " + user;
                // โหลดบาลานซ์ของยูสเซอร์นั้นๆ ทันที
                document.getElementById('balanceDisplay').innerText = (parseFloat(localStorage.getItem('bal_' + user) || 0)).toFixed(4);
            } else { alert("ชื่อหรือรหัสผ่านไม่ถูกต้อง"); }
        }

        function handleMiningAction() {
            if (uiInterval) {
                clearInterval(uiInterval); uiInterval = null;
                document.getElementById('mineBtn').innerText = "เริ่มขุด (Start)";
            } else {
                uiInterval = setInterval(() => {
                    let currentBal = parseFloat(localStorage.getItem('bal_' + loggedInUser) || 0);
                    currentBal += baseRate;
                    localStorage.setItem('bal_' + loggedInUser, currentBal);
                    document.getElementById('balanceDisplay').innerText = currentBal.toFixed(4);
                }, 1000);
                document.getElementById('mineBtn').innerText = "🛑 หยุดขุด (Stop)";
            }
        }

        function logout() {
            clearInterval(uiInterval); uiInterval = null;
            location.reload();
        }
    </script>
</body>
</html>
