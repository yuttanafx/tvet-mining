<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TVET Telegram Private Mining</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        /* สไตล์เดิมที่พี่ชอบ */
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #090d16; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #090d16 0%, #111827 100%); color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; }
        .app-container { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 25px; padding: 15px 20px; width: 100%; max-width: 340px; height: 95vh; max-height: 580px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .logo-img { width: 85px; height: 85px; border-radius: 50%; box-shadow: 0 0 25px rgba(27, 169, 233, 0.6); margin: 0 auto 5px auto; }
        .mining-status { font-size: 11px; color: #fbbf24; background: rgba(245, 158, 11, 0.15); padding: 5px 10px; border-radius: 20px; margin-bottom: 5px; }
        .difficulty-card { background: rgba(245, 158, 11, 0.04); border: 1px solid rgba(245, 158, 11, 0.15); border-radius: 12px; padding: 10px; margin-bottom: 8px; text-align: left; font-size: 11px; }
        .difficulty-card span { float: right; font-weight: bold; color: #fbbf24; }
        .btn { width: 100%; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; margin-bottom: 6px; }
        .btn-primary { background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%); }
        .btn-claim { background: linear-gradient(90deg, #10b981 0%, #059669 100%); }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #090d16; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: rgba(17, 24, 39, 0.95); border: 1px solid #f59e0b; border-radius: 20px; padding: 25px; width: 280px; }
        .input-field { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #444; background: #000; color: white; }
    </style>
</head>
<body>

    <div id="loginSection" class="login-overlay">
        <div class="login-box">
            <input type="text" id="userInput" class="input-field" placeholder="Username">
            <input type="password" id="passInput" class="input-field" placeholder="Password">
            <button class="btn btn-primary" onclick="loginAction()">เข้าสู่ระบบ</button>
        </div>
    </div>

    <div class="app-container">
        <div>
            <img src="https://i.postimg.cc/ncjSwbjv/Gemini-Generated-Image-ncdze7ncdze7ncdz-removebg-preview.png" class="logo-img">
            <div class="mining-status">⛏️ สมาชิก: <span id="currentLoggedUser">User</span></div>
            <div id="balanceDisplay" style="font-size: 34px; font-weight: 800; color: #ffffff;">0.0000</div>
        </div>
        <div>
            <div class="difficulty-card">
                <div>⚡ ความเร็ว: <span id="rateDisplay">0.0000</span></div>
                <div>📊 เหรียญในระบบ: <span>270,000 / 47,000,000 TVE</span></div>
            </div>
            <button class="btn btn-primary" onclick="toggleMining()">เริ่มขุดเหมือง</button>
            <button class="btn btn-claim" onclick="claimReward()">ประมวลผลและถอนเหรียญ</button>
        </div>
    </div>

    <script>
        const CONTRACT_ADDRESS = "0xd77887dB74B319276B27446AB43A161B250EC6B5";
        
        // ฐานข้อมูลสมาชิก
        const DB = {
            "terravolteco": { pass: "tve2026", rate: 0.01 },
            "tve001": { pass: "power999", rate: 0.02 }
        };
        let bal = 0, user = null, bR = 0, intV = null;

        function loginAction() {
            let u = document.getElementById("userInput").value.trim().toLowerCase();
            let p = document.getElementById("passInput").value.trim();
            if (DB[u] && DB[u].pass === p) {
                user = u; bR = DB[u].rate;
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("currentLoggedUser").innerText = u;
                document.getElementById("rateDisplay").innerText = bR + " TVE/s";
            } else { alert("รหัสผ่านไม่ถูกต้อง"); }
        }

        function toggleMining() {
            if (intV) { clearInterval(intV); intV = null; alert("หยุดขุด"); }
            else { intV = setInterval(() => { bal += bR; document.getElementById("balanceDisplay").innerText = bal.toFixed(4); }, 1000); alert("เริ่มขุด"); }
        }

        async function claimReward() {
            if (bal <= 0) return alert("ไม่มีเหรียญ");
            try {
                const signer = await (new ethers.BrowserProvider(window.ethereum)).getSigner();
                const userAddress = await signer.getAddress();
                
                const response = await fetch('http://localhost:3000/get-signature', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user: userAddress, amount: Math.floor(bal) })
                });
                const { signature } = await response.json();
                
                const contract = new ethers.Contract(CONTRACT_ADDRESS, ["function claimTokens(uint256, bytes) external"], signer);
                const tx = await contract.claimTokens(Math.floor(bal), signature);
                await tx.wait();
                
                bal = 0;
                document.getElementById("balanceDisplay").innerText = "0.0000";
                alert("ถอนเหรียญสำเร็จ!");
            } catch (err) { alert("ถอนไม่สำเร็จ: เช็ค server.js ในคอมด้วยครับ"); }
        }
    </script>
</body>
</html>
