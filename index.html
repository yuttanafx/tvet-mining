<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVET Telegram Web3 Mining V2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #060913 0%, #0f172a 100%); color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .app-container { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 25px; padding: 25px 20px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .logo-img { width: 130px; height: 130px; border-radius: 50%; box-shadow: 0 0 35px rgba(245, 158, 11, 0.5); margin-bottom: 15px; object-fit: contain; }
        .mining-status { font-size: 13px; color: #fbbf24; background: rgba(245, 158, 11, 0.12); padding: 6px 14px; border-radius: 20px; display: inline-block; margin-bottom: 15px; font-weight: 500; }
        .balance-title { font-size: 12px; color: #9ca3af; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .balance-value { font-size: 36px; font-weight: 800; color: #ffffff; margin: 5px 0 15px 0; }
        .card-info { background: rgba(245, 158, 11, 0.06); border: 1px solid rgba(245, 158, 11, 0.15); border-radius: 12px; padding: 12px; margin-bottom: 15px; text-align: left; font-size: 12px; line-height: 1.6; }
        .card-info span { float: right; font-weight: bold; color: #fbbf24; }
        .btn { width: 100%; padding: 13px; font-size: 15px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; transition: all 0.2s; margin-bottom: 10px; }
        .btn-tg { background: linear-gradient(90deg, #24a1de 0%, #1782b6 100%); color: #ffffff; box-shadow: 0 4px 15px rgba(36, 161, 222, 0.3); }
        .btn-primary { background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%); color: #000000; }
        .btn-stop { background: #ef4444; color: #ffffff; }
        .btn-claim { background: linear-gradient(90deg, #10b981 0%, #059669 100%); color: #ffffff; }
        .btn-claim:disabled, .btn-primary:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; box-shadow: none; }
        .transfer-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; margin-top: 15px; text-align: left; }
        .input-addr { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #4b5563; background: #1f2937; color: #fff; font-size: 12px; box-sizing: border-box; margin-top: 5px; margin-bottom: 8px; }
        .info-text { font-size: 11px; color: #6b7280; margin-top: 5px; word-break: break-all; }
    </style>
</head>
<body>

    <div class="app-container">
        <img src="https://i.postimg.cc/ncjSwbjv/Gemini-Generated-Image-ncdze7ncdze7ncdz-removebg-preview.png" class="logo-img" alt="TVET Coin Logo">
        <div class="mining-status" id="miningStatus">✨ ระบบล็อกอินด่วนออนเชน V2 (เปิดระบบ)</div>
        
        <p class="balance-title">ยอดขุดปั๊มเหรียญสะสม (TVE)</p>
        <div class="balance-value" id="balanceDisplay">0.0000</div>

        <div class="card-info">
            <div>📊 ยอดผลิตทั้งหมดในระบบ: <span id="totalSupplyDisplay">กำลังโหลดค่าออนเชน...</span></div>
            <div>⚡ ความเร็วเฟสปัจจุบัน: <span id="rateDisplay">0.0050 TVE / บล็อก</span></div>
            <div>🔥 ระดับความยากออนเชน: <span id="diffDisplay">100%</span></div>
        </div>

        <button class="btn btn-tg" id="loginBtn" onclick="quickLogin()">⚡ คลิกเพื่อเชื่อมต่อระบบด่วน</button>
        
        <button class="btn btn-primary" id="mineBtn" onclick="handleMiningAction()" disabled>🚀 เริ่มขุดเหมืองตรง (Start)</button>
        <button class="btn btn-claim" id="claimBtn" onclick="claimMiningReward()" disabled>ถอนและผลิตเหรียญใหม่</button>
        
        <div class="info-text" id="walletAddress">สถานะ: ยังไม่ได้เชื่อมต่อกระเป๋า</div>

        <div class="transfer-box">
            <label style="font-size: 12px; font-weight: bold; color: #9ca3af;">📦 โอนเหรียญ TVE ไปกระเป๋าหลัก (MetaMask)</label>
            <input type="text" class="input-addr" id="targetWallet" placeholder="วางเลขกระเป๋า 0x... ปลายทาง">
            <button class="btn btn-claim" id="transferBtn" style="padding: 8px; font-size: 12px; margin: 0;" onclick="transferToMetaMask()" disabled>กดโอนเหรียญข้ามกระเป๋า</button>
        </div>
    </div>

    <script>
        // 🎯 บรรทัดที่ 56: ใส่เลขสัญญาเหมืองจริง V2 ของพี่ตรงนี้ได้เลยครับ!
        const MINING_CONTRACT_ADDRESS = "0x6Caa0219a0ACb4d6E4eC76764691a3D4c2148648"; 

        // จัดการล้างพิมพ์เขียว ABI ให้คลีนที่สุดเพื่อความปลอดภัยไม่ให้สัญญารวน
        const MINING_CONTRACT_ABI = [
            "function startMining() external",
            "function stopMining() external",
            "function claimReward() external",
            "function miners(address) external view returns (uint256 startBlock, uint256 accumulatedReward, bool isMining)"
        ];

        let provider, signer, miningContract;
        let walletAddr = "not_connected";
        let isMiningOnChain = false;
        let uiInterval;
        let currentRatePerBlock = 0.0050;

        async function quickLogin() {
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.innerText = "⏳ กำลังสร้างกระเป๋าออนเชน...";
            try {
                // บังคับให้เซ็ตอัปและโชว์ตัวเลขกระเป๋าเงินขึ้นมาก่อนทันทีเพื่อไม่ให้ระบบค้าง
                let privateKey = localStorage.getItem('tvet_miner_pkey');
                if (!privateKey) {
                    const wallet = ethers.Wallet.createRandom();
                    privateKey = wallet.privateKey;
                    localStorage.setItem('tvet_miner_pkey', privateKey);
                }

                provider = new ethers.JsonRpcProvider("https://polygon-rpc.com");
                signer = new ethers.Wallet(privateKey, provider);
                walletAddr = await signer.getAddress();

                // การแสดงผลสำเร็จด่านแรก
                document.getElementById('walletAddress').innerText = `เลขกระเป๋าขุดด่วนของพี่: ${walletAddr}`;
                loginBtn.innerText = "🟢 เชื่อมต่อสำเร็จ";
                loginBtn.style.background = "#10b981";
                loginBtn.disabled = true;

                document.getElementById('mineBtn').disabled = false;
                document.getElementById('transferBtn').disabled = false;

                // โหลดสัญญาระบบเหมืองตัวจริง
                if(MINING_CONTRACT_ADDRESS !== "0x0000000000000000000000000000000000000000") {
                    miningContract = new ethers.Contract(MINING_CONTRACT_ADDRESS, MINING_CONTRACT_ABI, signer);
                    await checkOnChainStatus();
                }
            } catch (error) {
                console.error(error);
                alert("กระเป๋าเชื่อมต่อสำเร็จ แต่ยังดึงค่าจากสัญญาไม่ได้ ให้ลองตรวจสอบเลขสัญญาเหมืองอีกครั้งครับ");
            }
        }

        async function checkOnChainStatus() {
            if(!miningContract || walletAddr === "not_connected") return;
            try {
                const minerInfo = await miningContract.miners(walletAddr);
                isMiningOnChain = minerInfo.isMining;
                
                document.getElementById('totalSupplyDisplay').innerText = "47,000,000 TVE (Max Supply)";
                const mineBtn = document.getElementById('mineBtn');
                const statusDisp = document.getElementById('miningStatus');

                if(isMiningOnChain) {
                    mineBtn.innerText = "🛑 หยุดขุด (Stop Mining)";
                    mineBtn.className = "btn btn-stop";
                    statusDisp.innerText = "⛏️ บล็อกเชนบันทึกสำเร็จ ยอดกำลังรันออนเชน...";
                    statusDisp.style.color = "#34d399";
                    startUiSimulation();
                } else {
                    mineBtn.innerText = "🚀 เริ่มขุดเหมืองตรง (Start)";
                    mineBtn.className = "btn btn-primary";
                    statusDisp.innerText = "🟢 พร้อมส่งคำสั่งเปิดเหมืองขุด";
                    statusDisp.style.color = "#fbbf24";
                    clearInterval(uiInterval);
                }
                document.getElementById('claimBtn').disabled = false;
            } catch (e) { console.error(e); }
        }

        async function handleMiningAction() {
            if(!miningContract) return alert("โปรดกรอกเลขสัญญาเหมืองจริงในโค้ดบรรทัดที่ 56 ก่อนครับพี่");
            const statusDisp = document.getElementById('miningStatus');
            try {
                statusDisp.innerText = "⏳ กำลังส่งธุรกรรมตรงเข้าสู่บล็อกเชน...";
                if (!isMiningOnChain) {
                    const tx = await miningContract.startMining();
                    await tx.wait();
                } else {
                    const tx = await miningContract.stopMining();
                    await tx.wait();
                }
                await checkOnChainStatus();
            } catch (err) {
                alert("ธุรกรรมถูกปฏิเสธ: ตรวจสอบว่าในกระเป๋าขุดด่วนใบนี้มีเหรียญ POL เป็นค่าแก๊สหรือยังครับพี่");
                await checkOnChainStatus();
            }
        }

        async function claimMiningReward() {
            if(!miningContract) return;
            const statusDisp = document.getElementById('miningStatus');
            try {
                statusDisp.innerText = "⏳ กำลังส่งคำสั่งเคลมรางวัลผลิตเหรียญ...";
                const tx = await miningContract.claimReward();
                await tx.wait();
                statusDisp.innerText = "🎉 เคลมรางวัลสำเร็จ!";
                await checkOnChainStatus();
            } catch (err) {
                alert("การเคลมติดขัด: ตรวจสอบค่าแก๊ส POL หรือเงื่อนไขในสัญญา");
            }
        }

        async function transferToMetaMask() {
            alert("กระเป๋าขุดด่วนพร้อมโอนเหรียญออก ทันทีที่พี่เคลมเหรียญจากเหมืองเข้ามาสะสมครับ");
        }

        function startUiSimulation() {
            clearInterval(uiInterval);
            uiInterval = setInterval(() => {
                let current = parseFloat(document.getElementById('balanceDisplay').innerText);
                current += (currentRatePerBlock / 12); 
                document.getElementById('balanceDisplay').innerText = current.toFixed(4);
            }, 1000);
        }
    </script>
</body>
</html>
