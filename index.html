<script>
    // ... โค้ดส่วนบนคงเดิม ...
    
    async function quickLogin() {
        const statusEl = document.getElementById('miningStatus');
        statusEl.innerText = "⏳ กำลัง Debug การเชื่อมต่อ...";
        
        try {
            // ลองเข้าถึง Provider แบบเจาะจง Node
            provider = new ethers.JsonRpcProvider("https://polygon-rpc.com");
            
            // ตรวจสอบกระเป๋า (ถ้าไม่มีให้สร้าง)
            let pk = localStorage.getItem('tvet_pkey');
            if(!pk) {
                let wallet = ethers.Wallet.createRandom();
                pk = wallet.privateKey;
                localStorage.setItem('tvet_pkey', pk);
            }
            signer = new ethers.Wallet(pk, provider);
            
            // [จุดตายที่ 1] ตรวจสอบเลขสัญญา (ถ้าเลขนี้ว่าง หรือเป็น 0x0... มันจะค้าง)
            if(MINING_CONTRACT === "0x0000000000000000000000000000000000000000") {
                throw new Error("ลืมใส่เลขสัญญาเหมืองที่บรรทัด 90 ครับ!");
            }
            
            contract = new ethers.Contract(MINING_CONTRACT, ABI, signer);
            
            // [จุดตายที่ 2] ทดสอบดึงข้อมูลจากสัญญา (ถ้าติดตรงนี้คือเลขสัญญาเหมืองผิด)
            const addr = await signer.getAddress();
            document.getElementById('walletAddress').innerText = addr;
            document.getElementById('loginBtn').innerText = "🟢 เชื่อมต่อสำเร็จ";
            statusEl.innerText = "🟢 เชื่อมต่อออนเชนเรียบร้อย";
            
        } catch(e) { 
            console.error(e);
            // โชว์ Error ออกมาที่หน้าจอให้พี่เห็นชัดๆ เลยครับ
            statusEl.innerText = "❌ ERROR: " + e.message;
            alert("เชื่อมต่อไม่ได้เพราะ: " + e.message);
        }
    }
    // ... โค้ดส่วนล่างคงเดิม ...
</script>
