<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVET AI Mining System</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050816;
    font-family:Segoe UI,sans-serif;
    color:#fff;
}

/* BACKGROUND */

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at center, rgba(251,191,36,0.15), transparent 25%),
    radial-gradient(circle at top left, rgba(59,130,246,0.12), transparent 30%);
    animation:bgRotate 25s linear infinite;
}

@keyframes bgRotate{
    from{transform:rotate(0deg) scale(1.2);}
    to{transform:rotate(360deg) scale(1.2);}
}

/* LOGIN */

.login-overlay{
    position:fixed;
    inset:0;
    z-index:99999;
    background:#050816;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-card{
    width:90%;
    max-width:320px;
    background:rgba(15,23,42,0.9);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:30px;
    padding:25px;
    position:relative;
    z-index:100000;
    backdrop-filter:blur(20px);
    box-shadow:0 0 40px rgba(251,191,36,0.12);
}

.login-title{
    text-align:center;
    font-size:22px;
    color:#fbbf24;
    margin-bottom:20px;
    font-weight:bold;
}

.input-field{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:14px;
    background:#020617;
    color:#fff;
    margin-bottom:12px;
}

.btn{
    width:100%;
    border:none;
    border-radius:16px;
    padding:14px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-login{
    background:#fbbf24;
    color:#000;
}

/* MAIN */

.app-container{
    position:relative;
    z-index:5;
    width:95%;
    max-width:390px;
    height:95vh;
    margin:10px auto;
    padding:20px;
    border-radius:35px;
    background:rgba(15,23,42,0.82);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:
    0 0 40px rgba(251,191,36,0.08),
    inset 0 0 20px rgba(255,255,255,0.03);

    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.signal{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#10b981;
    box-shadow:0 0 15px #10b981;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{opacity:0.5; transform:scale(0.8);}
    50%{opacity:1; transform:scale(1.2);}
    100%{opacity:0.5; transform:scale(0.8);}
}

.logo-box{
    text-align:center;
    margin-top:10px;
}

.logo{
    width:80px;
    height:80px;
    border-radius:50%;
    border:2px solid #fbbf24;
    box-shadow:0 0 30px rgba(251,191,36,0.4);
}

.system-title{
    margin-top:10px;
    color:#fbbf24;
    letter-spacing:2px;
    font-size:14px;
}

.user-line{
    color:#9ca3af;
    font-size:11px;
    margin-top:5px;
}

.balance-section{
    text-align:center;
    margin-top:20px;
}

.balance-label{
    color:#94a3b8;
    font-size:11px;
}

.balance-value{
    font-size:42px;
    font-family:monospace;
    font-weight:800;
    margin-top:8px;
    text-shadow:0 0 25px rgba(251,191,36,0.3);
}

.balance-unit{
    color:#fbbf24;
    font-size:14px;
}

.live-status{
    margin-top:8px;
    color:#10b981;
    font-size:12px;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

.card{
    background:rgba(17,24,39,0.8);
    border-radius:18px;
    padding:14px;
    border:1px solid rgba(255,255,255,0.05);
}

.card-label{
    font-size:9px;
    color:#94a3b8;
}

.card-value{
    margin-top:8px;
    font-size:16px;
    font-weight:bold;
    color:#fbbf24;
}

.chart-box{
    margin-top:15px;
    background:rgba(2,6,23,0.7);
    border-radius:20px;
    padding:10px;
}

.hash-box{
    margin-top:12px;
    height:70px;
    overflow:hidden;
    border-radius:14px;
    background:#020617;
    padding:10px;
    font-size:9px;
    font-family:monospace;
    color:#10b981;
}

.bottom-panel{
    margin-top:15px;
}

.btn-red{
    background:#ef4444;
    color:#fff;
    margin-bottom:10px;
}

.btn-green{
    background:#10b981;
    color:#fff;
    margin-bottom:10px;
}

.btn-dark{
    background:#1e293b;
    color:#fff;
}

/* PARTICLES */

#particles{
    position:fixed;
    inset:0;
    z-index:0;
}

</style>
</head>

<body>

<canvas id="particles"></canvas>

<!-- LOGIN -->

<div class="login-overlay" id="loginSection">

    <div class="login-card">

        <div class="login-title">
            TVET AI ACCESS
        </div>

        <input
        type="text"
        id="userInput"
        class="input-field"
        placeholder="Username">

        <input
        type="password"
        id="passInput"
        class="input-field"
        placeholder="Password">

        <button
        class="btn btn-login"
        onclick="loginAction()">
        ENTER SYSTEM
        </button>

    </div>

</div>

<!-- APP -->

<div class="app-container">

    <div>

        <div class="top-bar">
            <div>TVET NODE-07</div>
            <div class="signal"></div>
        </div>

        <div class="logo-box">

            <img
            src="https://i.postimg.cc/ncjSwbjv/Gemini-Generated-Image-ncdze7ncdze7ncdz-removebg-preview.png"
            class="logo">

            <div class="system-title">
                DEEP TECH MINING
            </div>

            <div class="user-line" id="currentLoggedUser">
                USER : tve001
            </div>

        </div>

        <div class="balance-section">

            <div class="balance-label">
                LIVE TVE BALANCE
            </div>

            <div class="balance-value" id="balanceDisplay">
                0.2040
                <span class="balance-unit">TVE</span>
            </div>

            <div class="live-status">
                ● MINING ACTIVE
            </div>

        </div>

        <div class="dashboard-grid">

            <div class="card">
                <div class="card-label">EFFICIENCY</div>
                <div class="card-value" id="efficiency">
                    98.5%
                </div>
            </div>

            <div class="card">
                <div class="card-label">HASH RATE</div>
                <div class="card-value" id="hashrate">
                    142 TH/s
                </div>
            </div>

            <div class="card">
                <div class="card-label">NETWORK</div>
                <div class="card-value">
                    ONLINE
                </div>
            </div>

            <div class="card">
                <div class="card-label">LATENCY</div>
                <div class="card-value">
                    12ms
                </div>
            </div>

        </div>

        <div class="chart-box">
            <canvas id="miningChart"></canvas>
        </div>

        <div class="hash-box" id="hashBox"></div>

    </div>

    <div class="bottom-panel">

        <button class="btn btn-red">
            STOP MINING
        </button>

        <button class="btn btn-green">
            CLAIM CREDIT
        </button>

        <button class="btn btn-dark">
            CONNECT WALLET
        </button>

    </div>

</div>

<script>

/* LOGIN */

function loginAction(){

    const user =
    document.getElementById('userInput').value || 'tve001';

    document.getElementById('currentLoggedUser').innerText =
    'USER : ' + user;

    document.getElementById('loginSection').style.display =
    'none';
}

/* BALANCE */

let balance = 0.2040;

setInterval(()=>{

    balance += Math.random()*0.0005;

    document.getElementById('balanceDisplay').innerHTML =
    balance.toFixed(4) +
    ' <span class="balance-unit">TVE</span>';

},1500);

/* HASHRATE */

setInterval(()=>{

    const h =
    (120 + Math.random()*40).toFixed(0);

    document.getElementById('hashrate').innerText =
    h + ' TH/s';

},2000);

/* EFFICIENCY */

setInterval(()=>{

    const e =
    (97 + Math.random()*2).toFixed(1);

    document.getElementById('efficiency').innerText =
    e + '%';

},1800);

/* CHART */

const ctx =
document.getElementById('miningChart');

const chart = new Chart(ctx,{

    type:'line',

    data:{
        labels:['1','2','3','4','5','6','7'],
        datasets:[{
            data:[0.2,0.4,0.3,0.5,0.45,0.7,0.8],
            borderColor:'#fbbf24',
            borderWidth:3,
            tension:0.5,
            fill:true,
            backgroundColor:'rgba(251,191,36,0.08)'
        }]
    },

    options:{
        plugins:{
            legend:{display:false}
        },

        scales:{
            x:{display:false},
            y:{display:false}
        }
    }

});

setInterval(()=>{

    const data =
    chart.data.datasets[0].data;

    data.shift();

    data.push(
    Math.random()*0.8 + 0.2
    );

    chart.update();

},1200);

/* HASH STREAM */

function randomHash(){
    return '0x' +
    Math.random()
    .toString(16)
    .substring(2,18);
}

setInterval(()=>{

    let html = '';

    for(let i=0;i<8;i++){

        html +=
        randomHash() + '<br>';
    }

    document.getElementById('hashBox').innerHTML =
    html;

},1000);

/* PARTICLES */

const canvas =
document.getElementById('particles');

const pctx =
canvas.getContext('2d');

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

const particles = [];

for(let i=0;i<70;i++){

    particles.push({

        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2,
        d:Math.random()*1

    });
}

function drawParticles(){

    pctx.clearRect(
    0,0,
    canvas.width,
    canvas.height
    );

    pctx.fillStyle =
    'rgba(251,191,36,0.35)';

    particles.forEach(p=>{

        pctx.beginPath();

        pctx.arc(
        p.x,
        p.y,
        p.r,
        0,
        Math.PI*2
        );

        pctx.fill();

        p.y += p.d;

        if(p.y > canvas.height){
            p.y = 0;
        }

    });

    requestAnimationFrame(drawParticles);
}

drawParticles();

</script>

</body>
</html>
