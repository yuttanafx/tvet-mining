```html
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TVET NODE-07</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Segoe UI',sans-serif;
    background:
    radial-gradient(circle at top,
    #13203d 0%,
    #090d16 40%,
    #02040a 100%);
    color:#fff;
}

/* 3D BACKGROUND */

#reactor3d{
    position:fixed;
    inset:0;
    z-index:0;
    opacity:0.45;
    pointer-events:none;
}

/* CYBER GRID */

body::after{
    content:'';
    position:fixed;
    inset:0;

    background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

    background-size:50px 50px;

    animation:gridMove 20s linear infinite;

    pointer-events:none;

    z-index:0;
}

@keyframes gridMove{

    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(50px);
    }
}

/* PARTICLES */

.cyber-particle{
    position:fixed;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#fbbf24;
    box-shadow:0 0 12px #fbbf24;
    z-index:1;
    animation:floatParticle linear infinite;
}

@keyframes floatParticle{

    from{
        transform:translateY(100vh);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    to{
        transform:translateY(-100vh);
        opacity:0;
    }
}

/* MAIN APP */

.app-container{
    position:relative;
    z-index:5;

    width:95%;
    max-width:420px;
    height:95vh;

    margin:10px auto;

    background:rgba(5,10,20,0.75);

    backdrop-filter:blur(20px);

    border:1px solid rgba(251,191,36,0.2);

    border-radius:30px;

    box-shadow:
    0 0 40px rgba(251,191,36,0.15),
    inset 0 0 40px rgba(255,255,255,0.03);

    padding:20px;

    overflow:auto;
}

/* HEADER */

.top-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.node-title{
    font-size:18px;
    font-weight:800;
    letter-spacing:2px;
}

.online{
    color:#00ff99;
    font-size:13px;
}

/* LOGO */

.logo-wrap{
    text-align:center;
    margin-top:20px;
}

.logo-ring{
    width:180px;
    height:180px;

    border-radius:50%;

    margin:auto;

    border:3px solid #fbbf24;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 0 25px rgba(251,191,36,0.5),
    0 0 70px rgba(251,191,36,0.2);

    animation:ringRotate 12s linear infinite;
}

@keyframes ringRotate{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

.logo-ring img{
    width:120px;
    height:120px;
    border-radius:50%;
}

/* BALANCE */

.balance-title{
    text-align:center;
    margin-top:20px;
    color:#aaa;
    letter-spacing:2px;
}

.balance-value{
    text-align:center;

    font-size:70px;
    font-weight:900;

    margin-top:10px;

    color:#fff;

    text-shadow:
    0 0 10px #fbbf24,
    0 0 30px #fbbf24,
    0 0 60px rgba(251,191,36,0.5);

    animation:balancePulse 2s infinite;
}

.balance-unit{
    font-size:28px;
    color:#fbbf24;
}

@keyframes balancePulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.02);
    }

    100%{
        transform:scale(1);
    }
}

.mining-active{
    text-align:center;
    margin-top:8px;
    color:#00ff99;
    font-size:22px;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0.4;
    }
}

/* CARDS */

.dashboard-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:30px;
}

.card{
    background:rgba(10,20,35,0.7);

    border:1px solid rgba(0,255,255,0.15);

    border-radius:18px;

    padding:18px;

    box-shadow:
    inset 0 0 20px rgba(255,255,255,0.03),
    0 0 25px rgba(0,255,255,0.05);
}

.card-label{
    color:#8ca3af;
    font-size:11px;
    margin-bottom:10px;
}

.card-value{
    font-size:28px;
    font-weight:800;
    color:#fbbf24;
}

/* GRAPH */

.graph-box{
    margin-top:30px;

    background:rgba(0,0,0,0.35);

    border-radius:20px;

    padding:15px;
}

/* BUTTONS */

.btn-group{
    margin-top:25px;
}

.btn{
    width:100%;

    padding:16px;

    margin-bottom:12px;

    border:none;
    border-radius:16px;

    font-size:15px;
    font-weight:700;

    cursor:pointer;

    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-red{
    background:linear-gradient(90deg,#ff3d3d,#aa1111);
    color:#fff;
}

.btn-green{
    background:linear-gradient(90deg,#00d084,#009966);
    color:#fff;
}

.btn-purple{
    background:linear-gradient(90deg,#8247e5,#5722aa);
    color:#fff;
}

/* WALLET */

.wallet-box{
    margin-top:15px;

    text-align:center;

    font-size:13px;

    color:#ccc;
}

/* RADAR */

.radar{
    position:fixed;
    bottom:20px;
    right:20px;

    width:120px;
    height:120px;

    border-radius:50%;

    border:1px solid rgba(16,185,129,0.3);

    overflow:hidden;

    z-index:2;
}

.radar::before{
    content:'';

    position:absolute;

    width:50%;
    height:2px;

    background:
    linear-gradient(to right,#10b981,transparent);

    top:50%;
    left:50%;

    transform-origin:left center;

    animation:radarSpin 2s linear infinite;
}

@keyframes radarSpin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* LOGIN */

.login-overlay{
    position:fixed;
    inset:0;

    background:#000;

    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;
}

.login-box{
    width:90%;
    max-width:320px;

    background:rgba(5,10,20,0.95);

    border:1px solid #fbbf24;

    border-radius:25px;

    padding:25px;
}

.input-field{
    width:100%;

    padding:14px;

    margin-bottom:12px;

    border-radius:12px;

    border:none;

    background:#111827;

    color:#fff;
}

.login-btn{
    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    background:#fbbf24;

    font-weight:800;

    cursor:pointer;
}

</style>
</head>

<body>

<div id="reactor3d"></div>

<div class="radar"></div>

<div id="loginSection" class="login-overlay">

    <div class="login-box">

        <h2 style="text-align:center;margin-bottom:20px;color:#fbbf24;">
            TVET LOGIN
        </h2>

        <input type="text" id="userInput"
        class="input-field"
        placeholder="Username">

        <input type="password" id="passInput"
        class="input-field"
        placeholder="Password">

        <button class="login-btn"
        onclick="loginAction()">

            ACCESS NODE

        </button>

    </div>

</div>

<div class="app-container">

    <div class="top-header">

        <div>

            <div class="node-title">
                TVET NODE-07
            </div>

            <div style="color:#fbbf24;font-size:12px;">
                DEEP TECH MINING SYSTEM
            </div>

        </div>

        <div class="online">
            ONLINE ●
        </div>

    </div>

    <div class="logo-wrap">

        <div class="logo-ring">

            <img src="https://i.postimg.cc/ncjSwbjv/Gemini-Generated-Image-ncdze7ncdze7ncdz-removebg-preview.png">

        </div>

    </div>

    <div class="balance-title">
        LIVE TVE BALANCE
    </div>

    <div class="balance-value"
    id="balanceDisplay">

        0.0000
        <span class="balance-unit">TVE</span>

    </div>

    <div class="mining-active">
        ● CARBON CREDIT ACTIVE
    </div>

    <div class="dashboard-grid">

        <div class="card">
            <div class="card-label">
                EFFICIENCY
            </div>

            <div class="card-value">
                97.5%
            </div>
        </div>

        <div class="card">
            <div class="card-label">
                HASH RATE
            </div>

            <div class="card-value">
                132 TH/s
            </div>
        </div>

        <div class="card">
            <div class="card-label">
                POWER
            </div>

            <div class="card-value"
            id="rateDisplay">

                0.0100 TVE/s

            </div>
        </div>

        <div class="card">
            <div class="card-label">
                DIFFICULTY
            </div>

            <div class="card-value">
                PHASE 1
            </div>
        </div>

    </div>

    <div class="graph-box">

        <canvas id="miningChart"></canvas>

    </div>

    <div class="btn-group">

        <button class="btn btn-red"
        onclick="toggleMining()">

            STOP MINING

        </button>

        <button class="btn btn-green"
        onclick="claimReward()">

            CLAIM TVE

        </button>

        <button class="btn btn-purple"
        onclick="connectWallet()">

            CONNECT WEB3

        </button>

    </div>

    <div class="wallet-box"
    id="walletDisplay">

        Wallet : Not Connected

    </div>

</div>

<script>

/* PARTICLES */

for(let i=0;i<60;i++){

    const p = document.createElement('div');

    p.className = 'cyber-particle';

    p.style.left =
    Math.random()*100 + 'vw';

    p.style.animationDuration =
    5 + Math.random()*8 + 's';

    p.style.opacity =
    Math.random();

    document.body.appendChild(p);
}

/* THREE JS */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer({
    alpha:true,
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.getElementById('reactor3d')
.appendChild(renderer.domElement);

const geometry =
new THREE.TorusGeometry(5,0.15,16,100);

const material =
new THREE.MeshBasicMaterial({
    color:0xfbbf24,
    wireframe:true
});

const torus =
new THREE.Mesh(geometry,material);

scene.add(torus);

camera.position.z = 12;

function animate(){

    requestAnimationFrame(animate);

    torus.rotation.x += 0.003;
    torus.rotation.y += 0.005;

    renderer.render(scene,camera);
}

animate();

/* CHART */

const ctx =
document.getElementById('miningChart');

new Chart(ctx,{

    type:'line',

    data:{
        labels:[
            '','','','','','',''
        ],

        datasets:[{

            data:[
                0.1,
                0.4,
                0.2,
                0.7,
                0.5,
                0.9,
                1.2
            ],

            borderColor:'#fbbf24',

            tension:0.5,

            fill:true,

            backgroundColor:
            'rgba(251,191,36,0.1)'
        }]
    },

    options:{

        plugins:{
            legend:{
                display:false
            }
        },

        scales:{
            y:{
                display:false
            },

            x:{
                display:false
            }
        }
    }
});

/* LOGIN */

let user = null;
let miningRate = 0.01;
let balance = 0;
let mining = true;

const DB = {

    "tvetech":{
        pass:"tve2026",
        rate:0.01
    },

    "tve001":{
        pass:"power999",
        rate:0.002
    }
};

function loginAction(){

    const u =
    document.getElementById('userInput')
    .value
    .trim()
    .toLowerCase();

    const p =
    document.getElementById('passInput')
    .value
    .trim();

    if(DB[u] && DB[u].pass === p){

        user = u;

        miningRate = DB[u].rate;

        document.getElementById(
        'loginSection'
        ).style.display = 'none';

        document.getElementById(
        'rateDisplay'
        ).innerText =
        miningRate.toFixed(4)
        + ' TVE/s';

        loadBalance();

    }else{

        alert('INVALID ACCESS');
    }
}

/* BALANCE */

function loadBalance(){

    balance = parseFloat(

        localStorage.getItem(
        'tvet_balance_' + user
        ) || 0

    );

    updateBalance();
}

function updateBalance(){

    document.getElementById(
    'balanceDisplay'
    ).innerHTML =

    balance.toFixed(4) +

    ' <span class="balance-unit">TVE</span>';
}

setInterval(()=>{

    if(mining){

        balance += miningRate;

        localStorage.setItem(
            'tvet_balance_' + user,
            balance
        );

        updateBalance();
    }

},1000);

/* BUTTONS */

function toggleMining(){

    mining = !mining;

    alert(
        mining
        ? 'MINING STARTED'
        : 'MINING STOPPED'
    );
}

/* WEB3 */

async function connectWallet(){

    try{

        const provider =
        new ethers.BrowserProvider(
            window.ethereum
        );

        const signer =
        await provider.getSigner();

        const address =
        await signer.getAddress();

        document.getElementById(
        'walletDisplay'
        ).innerText =

        'Wallet : ' +

        address.substring(0,6)

        + '...'

        + address.substring(38);

    }catch(err){

        alert('METAMASK NOT FOUND');
    }
}

/* CLAIM */

async function claimReward(){

    alert(
        'CLAIM SYSTEM READY'
    );
}

</script>

</body>
</html>
```
