<script>
    // 1. เปลี่ยนมาใช้ URL Gateway ที่ผ่านได้ทุก Gateway ครับพี่
    async function quickLogin() {
        try {
            // ปรับเปลี่ยน RPC มาใช้ตัว Public ที่เสถียรที่สุด
            const rpcs = [
                "https://polygon.llamarpc.com",
                "https://rpc-mainnet.maticvigil.com",
                "https://polygon-mainnet.public.blastapi.io"
            ];
            
            let provider;
            for(let url of rpcs) {
                try {
                    provider = new ethers.JsonRpcProvider(url);
                    await provider.getNetwork(); // ถ้าเข้าได้จะข้ามไป
                    break;
                } catch(e) { continue; }
            }
            
            // ... (ส่วนที่เหลือของฟังก์ชัน quickLogin คงเดิมครับ)
            let pk = localStorage.getItem('tvet_pkey') || ethers.Wallet.createRandom().privateKey;
            localStorage.setItem('tvet_pkey', pk);
            signer = new ethers.Wallet(pk, provider);
            contract = new ethers.Contract(CONTRACT_ADDR, ABI, signer);
            // ...
        } catch(e) { 
            document.getElementById('status').innerText = "❌ ติดปัญหา: " + e.message;
        }
    }
</script>
