<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVET Token Mining App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #090d16 0%, #111827 100%); color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .app-container { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 25px; padding: 30px 20px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .logo-img { width: 140px; height: 140px; border-radius: 50%; border: 3px solid #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); margin-bottom: 15px; object-fit: cover; }
        .mining-status { font-size: 13px; color: #34d399; background: rgba(52, 211, 153, 0.15); padding: 6px 14px; border-radius: 20px; display: inline-block; margin-bottom: 15px; font-weight: 500; }
        .balance-title { font-size: 13px; color: #9ca3af; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .balance-value { font-size: 38px; font-weight: 800; color: #ffffff; margin: 5px 0 20px 0; }
        .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; transition: all 0.2s; margin-bottom: 12px; }
        .btn-primary { background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%); color: #000000; }
        .btn-web3 { background: rgba(130, 71, 229, 0.15); color: #a78bfa; border: 1px solid rgba(130, 71, 229, 0.4); }
        .info-text { font-size: 11px; color: #6b7280; margin-top: 8px; }
        .user-id-badge { font-size: 12px; color: #fbbf24; margin-bottom: 10px; background: rgba(245, 158, 11, 0.1); padding: 4px 10px; border-radius: 6px; display: inline-block; }
    </style>
</head>
<body>
    <div class="app-container">
        <img src="https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=300&h=300&fit=crop" class="logo-img" alt="TVET Logo">
        <div id="userBadge" class="user-id-badge">ผู้ใช้งาน: Guest_User</div>
        <div class="mining-status" id="miningStatus">🟢 ระบบฐานข้อมูลกูเกิลพร้อมรัน</div>
        <p class="balance-title">ยอด TVET สะสมจริง</p>
        <div class="balance-value" id="balanceDisplay">0.0000</div>
        <button class="btn btn-primary" id="mineBtn" onclick="toggleMining()">เริ่มขุด (Start Mining)</button>
        <button class="btn btn-web3" id="walletBtn" onclick="connectWallet()">เชื่อมต่อกระเป๋า Web3</button>
        <div class="info-text" id="walletAddress">สถานะกระเป๋า: ยังไม่ได้ผูกระบบ</div>
    </div>

    <script>
        const FIREBASE_URL = "https://tvet-mining-default-rtdb.asia-southeast1.firebasedatabase.app";

        let tgUser = { id: "12345678" }; 
        let isMining = false; 
        let balance = 0.0000; 
        let miningInterval;
        let walletAddr = "not_connected";

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            const initData = window.Telegram.WebApp.initDataUnsafe;
            if (initData && initData.user) {
                tgUser = initData.user;
                document.getElementById('userBadge').innerText = `ผู้ใช้งาน: ${tgUser.username || tgUser.first_name} (ID: ${tgUser.id})`;
            }
        }

        // ดึงข้อมูลยอดเดิมมาโชว์หน้าจอ
        async function loadUserData() {
            try {
                const res = await fetch(`${FIREBASE_URL}/users/${tgUser.id}.json`);
                const data = await res.json();
                if (data) {
                    balance = parseFloat(data.balance) || 0;
                    walletAddr = data.wallet_address || "not_connected";
                    document.getElementById('balanceDisplay').innerText = balance.toFixed(4);
                    if(walletAddr !== "not_connected") {
                        document.getElementById('walletAddress').innerText = `กระเป๋า: ${walletAddr.substring(0,6)}...${walletAddr.substring(walletAddr.length-4)}`;
                        document.getElementById('walletBtn').innerText = "เชื่อมต่อสำเร็จ";
                        document.getElementById('walletBtn').style.background = "#10b981";
                        document.getElementById('walletBtn').style.color = "#ffffff";
                    }
                }
            } catch (err) {
                console.log("ไม่มีข้อมูลเก่า");
            }
        }
        loadUserData();

        function toggleMining() {
            const mineBtn = document.getElementById('mineBtn'); 
            const statusDisp = document.getElementById('miningStatus');
            
            if (!isMining) {
                isMining = true; 
                mineBtn.innerText = "กำลังขุดระบบ... กดหยุดเพื่อเซฟแต้ม"; 
                mineBtn.style.background = "#ef4444"; 
                mineBtn.style.color = "#ffffff"; 
                statusDisp.innerText = "⛏️ กำลังประมวลผลพลังงานจลน์..."; 
                statusDisp.style.color = "#fbbf24";
                
                miningInterval = setInterval(() => { 
                    balance += 0.0025; 
                    document.getElementById('balanceDisplay').innerText = balance.toFixed(4); 
                }, 1000);
            } else {
                isMining = false; 
                clearInterval(miningInterval); 
                mineBtn.innerText = "ขุดต่อ (Resume Mining)"; 
                mineBtn.style.background = "linear-gradient(90deg, #f59e0b 0%, #d97706 100%)"; 
                mineBtn.style.color = "#000000"; 
                statusDisp.innerText = "กำลังซิงค์แต้มขึ้นคลาวด์...";
                statusDisp.style.color = "#a78bfa";
                
                saveDataToFirebase();
            }
        }

        // ปรับปรุงโครงสร้างข้อมูลม้วนเดียวให้แตกกิ่งก้านชัดเจนบนหน้าจอ Firebase
        async function saveDataToFirebase() {
            try {
                // บังคับแปลงค่าตัวเลขให้เป็น String ชัดๆ ป้องกันคลาวด์เอ๋อ
                const uId = tgUser.id.toString();
                
                // ยิงอัปเดตตรงเข้าโฟลเดอร์ผู้ใช้งาน
                await fetch(`${FIREBASE_URL}/users/${uId}/balance.json`, {
                    method: 'PUT',
                    body: JSON.stringify(balance)
                });
                
                await fetch(`${FIREBASE_URL}/users/${uId}/tg_id.json`, {
                    method: 'PUT',
                    body: JSON.stringify(uId)
                });

                await fetch(`${FIREBASE_URL}/users/${uId}/wallet_address.json`, {
                    method: 'PUT',
                    body: JSON.stringify(walletAddr)
                });

                document.getElementById('miningStatus').innerText = "✅ บันทึกข้อมูลลงเซิร์ฟเวอร์เสร็จสิ้น!";
                document.getElementById('miningStatus').style.color = "#34d399";
            } catch (e) {
                document.getElementById('miningStatus').innerText = "⚠️ ระบบติดต่อฐานข้อมูลขัดข้อง";
                document.getElementById('miningStatus').style.color = "#f87171";
            }
        }

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    walletAddr = accounts[0];
                    document.getElementById('walletAddress').innerText = `กระเป๋า: ${walletAddr.substring(0,6)}...${walletAddr.substring(walletAddr.length-4)}`;
                    document.getElementById('walletBtn').innerText = "เชื่อมต่อสำเร็จ"; 
                    document.getElementById('walletBtn').style.background = "#10b981"; 
                    document.getElementById('walletBtn').style.color = "#ffffff";
                    saveDataToFirebase();
                } catch (error) { alert("ปฏิเสธการเชื่อมต่อ"); }
            } else { alert("กรุณาเปิดลิงก์นี้ในแอป MetaMask บนมือถือครับ"); }
        }
    </script>
</body>
</html>
