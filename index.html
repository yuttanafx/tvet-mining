<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TVET FUTURE MINING</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* [สไตล์คงเดิมของคุณ + ปรับความสวยงามของ Dashboard] */
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body { width:100%; height:100%; overflow:hidden; font-family: 'Segoe UI', sans-serif; background:#020611; color:#fff; }
        .app-container { width:100%; max-width:390px; height:100vh; margin:0 auto; padding:14px; background:linear-gradient(180deg, rgba(3,10,24,.96), rgba(1,6,15,.98)); border:1px solid rgba(0,255,255,.12); display:flex; flex-direction:column; justify-content:space-between; position:relative; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 10px; }
        .stat-card { background: linear-gradient(180deg, rgba(0,18,40,.95), rgba(0,10,20,.95)); border: 1px solid rgba(0,255,255,.12); border-radius: 16px; padding: 10px; text-align: center; }
        .stat-label { font-size: 8px; color: #999; text-transform: uppercase; margin-bottom: 2px; }
        .stat-value { font-size: 13px; font-weight: 800; color: #ffc400; }
        .balance { font-size: 40px; font-weight: 900; font-family: monospace; color: #ffcc33; text-align: center; margin: 10px 0; }
        .action-btn { width: 100%; height: 46px; border: none; border-radius: 14px; font-size: 12px; font-weight: 800; color: #fff; cursor: pointer; margin-bottom: 8px; }
        .stop-btn { background: linear-gradient(135deg, #ff4d4d, #5f1010); }
        .claim-btn { background: linear-gradient(135deg, #00ff99, #065f46); }
        .web3-btn { background: linear-gradient(135deg, #8b5cf6, #4c1d95); }
        .add-btn { background: linear-gradient(135deg, #00c3ff, #0047ab); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="topbar"><div class="logo-title">TVET NODE-07</div><div class="online">ONLINE ●</div></div>
    
    <div class="center">
        <div class="balance" id="balanceDisplay">0.0000 <span>TVE</span></div>
    </div>

    <div class="dashboard-grid">
        <div class="stat-card"><div class="stat-label">EFFICIENCY</div><div class="stat-value">98.5%</div></div>
        <div class="stat-card"><div class="stat-label">CARBON OFFSET</div><div class="stat-value">0.34 tCO2</div></div>
    </div>

    <canvas id="miningChart" style="height: 100px; width: 100%; margin: 10px 0;"></canvas>

    <div class="bottom-buttons">
        <button class="action-btn claim-btn" id="mineBtn" onclick="toggleMining()">START MINING</button>
        <button class="action-btn stop-btn" onclick="claimReward()">CLAIM TVE</button>
        <button class="action-btn web3-btn" onclick="connWallet()">CONNECT WEB3</button>
        <button class="action-btn add-btn" onclick="addTokenManual()">+ ADD TVE</button>
    </div>
</div>

<script>
    let balance = 0, miningRate = 0.002, mining = false, miningInterval = null;

    function toggleMining(){
        mining = !mining;
        const btn = document.getElementById("mineBtn");
        if(mining){
            btn.innerText = "STOP MINING";
            miningInterval = setInterval(()=>{
                balance = Number((balance + miningRate).toFixed(4));
                document.getElementById("balanceDisplay").innerHTML = balance.toFixed(4) + ' <span>TVE</span>';
            }, 1000);
        } else {
            btn.innerText = "START MINING";
            clearInterval(miningInterval);
        }
    }

    async function claimReward() {
        if (balance < 1) { alert("ต้องสะสมให้ครบ 1 TVE ก่อน"); return; }
        try {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            const userAddress = await signer.getAddress();
            
            // แก้ไขปัญหา Overflow โดยส่งค่าจำนวนเต็มเท่านั้น
            const amountStr = Math.floor(balance).toString();
            const amountToClaim = ethers.parseUnits(amountStr, 18);

            alert("กำลังขอสิทธิ์จากระบบ...");
            const response = await fetch("https://tvet-mining.vercel.app/api/get-signature", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userAddress, amount: amountToClaim.toString() })
            });
            const data = await response.json();
            
            const contract = new ethers.Contract("0xd77887dB74B319276B27446AB43A161B250EC6B5", ["function claimTokens(uint256, bytes) external"], signer);
            const tx = await contract.claimTokens(amountToClaim, data.signature);
            await tx.wait();
            alert("โอนสำเร็จ!");
            balance = 0;
            document.getElementById("balanceDisplay").innerHTML = "0.0000 <span>TVE</span>";
        } catch(err) {
            console.error(err);
            alert("Error: " + (err.reason || err.message));
        }
    }

    // Initialize Chart
    const ctx = document.getElementById('miningChart').getContext('2d');
    new Chart(ctx, { type: 'line', data: { labels: [1,2,3,4,5], datasets: [{ data: [0.1, 0.4, 0.2, 0.6, 0.3, 0.5], borderColor: '#ffcc33', tension: 0.4, fill: true, backgroundColor: 'rgba(255,204,51,0.1)' }] }, options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { display: false } } } });
</script>
</body>
</html>
